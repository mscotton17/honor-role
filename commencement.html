<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commencement — LBCC Toolbox</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root, [data-theme="light"] {
      --bg:           #f0f4f8;
      --card-bg:      #ffffff;
      --card-shadow:  0 4px 24px rgba(0,0,0,.10);
      --text:         #1a202c;
      --text-muted:   #718096;
      --text-body:    #2d3748;
      --text-soft:    #4a5568;
      --border:       #e2e8f0;
      --border-mid:   #cbd5e0;
      --drop-hover-bg:#ebf8ff;
      --drop-hover-bd:#4299e1;
      --accent:       #4299e1;
      --accent-dark:  #2b6cb0;
      --toggle-bg:    #e2e8f0;
      --toggle-color: #4a5568;
      --section-bd:   #e2e8f0;
      --badge-bg:     #e2e8f0;
      --badge-color:  #4a5568;
      --conflict-bg:  #fefcbf;
      --conflict-bd:  #f6e05e;
      --conflict-text:#744210;
    }

    [data-theme="dark"] {
      --bg:           #0f1117;
      --card-bg:      #1a1d27;
      --card-shadow:  0 4px 32px rgba(0,0,0,.50);
      --text:         #e2e8f0;
      --text-muted:   #718096;
      --text-body:    #cbd5e0;
      --text-soft:    #a0aec0;
      --border:       #2d3748;
      --border-mid:   #4a5568;
      --drop-hover-bg:#1a2744;
      --drop-hover-bd:#63b3ed;
      --accent:       #63b3ed;
      --accent-dark:  #4299e1;
      --toggle-bg:    #2d3748;
      --toggle-color: #e2e8f0;
      --section-bd:   #2d3748;
      --badge-bg:     #2d3748;
      --badge-color:  #a0aec0;
      --conflict-bg:  #2d2a0f;
      --conflict-bd:  #975a16;
      --conflict-text:#f6e05e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
      transition: background .25s, color .25s;
    }

    #themeToggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--toggle-bg);
      color: var(--toggle-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .4rem .75rem;
      font-size: .85rem;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
      z-index: 100;
    }
    #themeToggle:hover { border-color: var(--accent); color: var(--accent); }

    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: var(--text-muted);
      font-size: .85rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .3rem;
      transition: color .2s;
      z-index: 100;
    }
    .back-link:hover { color: var(--text); }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      padding: 2.5rem 2rem;
      max-width: 720px;
      width: 100%;
      margin-top: 1rem;
      transition: background .25s, box-shadow .25s;
    }

    .logo {
      max-width: 220px;
      height: auto;
      margin: 0 auto 1.5rem;
      display: block;
    }
    [data-theme="dark"]  .logo-light { display: none; }
    [data-theme="light"] .logo-dark  { display: none; }
    :root:not([data-theme="light"]) .logo-light { display: none; }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
    }
    header p {
      font-size: .9rem;
      color: var(--text-muted);
      margin-top: .25rem;
    }

    /* Upload sections */
    .upload-section {
      border: 1px solid var(--section-bd);
      border-radius: 10px;
      padding: 1.25rem 1.25rem 1rem;
      margin-bottom: 1.25rem;
    }
    .upload-section:last-child { margin-bottom: 0; }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .drop-zone {
      border: 2px dashed var(--border-mid);
      border-radius: 10px;
      padding: 1.75rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--drop-hover-bd);
      background: var(--drop-hover-bg);
    }
    .drop-zone input[type="file"] { display: none; }
    .drop-zone .upload-icon { font-size: 2rem; margin-bottom: .5rem; display: block; }
    .drop-zone p { color: var(--text-soft); font-size: .9rem; }
    .drop-zone p span { color: var(--accent); font-weight: 600; }

    .alert {
      border-radius: 8px;
      padding: .75rem 1rem;
      margin-top: 1rem;
      font-size: .875rem;
      display: none;
    }
    .alert.show { display: block; }
    .alert.error   { background: #2d1515; color: #fc8181; border: 1px solid #742a2a; }
    .alert.success { background: #142414; color: #68d391; border: 1px solid #276749; }
    .alert.info    { background: #0f1f35; color: #90cdf4; border: 1px solid #2b4e7a; }
    [data-theme="light"] .alert.error   { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    [data-theme="light"] .alert.success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    [data-theme="light"] .alert.info    { background: #ebf8ff; color: #2b6cb0; border: 1px solid #90cdf4; }

    #programOutput { margin-top: 1.25rem; }
    .prog-section { margin-bottom: 1.25rem; }
    .prog-section:last-child { margin-bottom: 0; }
    .prog-section-title {
      font-size: .9rem;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--border);
      padding-bottom: .35rem;
      margin-bottom: .5rem;
    }
    .prog-names {
      list-style: none;
      padding: 0;
      margin: 0;
      columns: 2;
      column-gap: 1.5rem;
    }
    .prog-names li {
      font-size: .875rem;
      color: var(--text-body);
      padding: .15rem 0;
      break-inside: avoid;
    }
    @media (max-width: 480px) { .prog-names { columns: 1; } }

    .conflicts-wrap { margin-top: 1rem; display: none; }
    .conflicts-wrap.show { display: block; }
    .conflicts-wrap > h2 {
      font-size: .95rem;
      font-weight: 600;
      color: var(--conflict-text);
      background: var(--conflict-bg);
      border: 1px solid var(--conflict-bd);
      border-radius: 8px;
      padding: .55rem .85rem;
      margin-bottom: .65rem;
    }
    .conflict-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .9rem;
      margin-bottom: .65rem;
    }
    .conflict-card p { font-size: .85rem; color: var(--text-muted); margin-bottom: .5rem; }
    .conflict-options { display: flex; flex-wrap: wrap; gap: .45rem; }
    .conflict-options label {
      display: flex; align-items: center; gap: .4rem;
      padding: .35rem .7rem;
      border: 1px solid var(--border-mid);
      border-radius: 6px; cursor: pointer;
      font-size: .875rem; color: var(--text-body);
      transition: border-color .15s, background .15s;
    }
    .conflict-options label:hover { border-color: var(--accent); background: var(--drop-hover-bg); }
    .conflict-options input[type="radio"]:checked + span { font-weight: 600; color: var(--accent); }
    .conflict-options label:has(input:checked) { border-color: var(--accent); background: var(--drop-hover-bg); }
    .badge {
      font-size: .72rem;
      background: var(--badge-bg); color: var(--badge-color);
      border-radius: 99px; padding: .1rem .4rem;
    }
    .apply-btn {
      display: block; width: 100%; margin-top: .5rem;
      padding: .65rem; background: #ed8936; color: #fff;
      font-size: .9rem; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
      transition: background .2s;
    }
    .apply-btn:hover { background: #c05621; }

    .city-input {
      width: 100%;
      margin-top: .5rem;
      padding: .45rem .65rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      font-size: .9rem;
    }
    .city-input:focus { outline: none; border-color: var(--accent); }
    .city-suggestion { font-size: .8rem; color: var(--text-muted); margin-top: .35rem; }
    .problem-students {
      list-style: disc;
      padding-left: 1.25rem;
      margin: .35rem 0 .5rem;
      font-size: .85rem;
      color: var(--text-body);
    }
    .problem-students li { padding: .1rem 0; }
    .per-student-row {
      display: flex; align-items: center; gap: .65rem;
      margin-bottom: .5rem;
    }
    .per-student-name { flex: 1; font-size: .875rem; color: var(--text-body); min-width: 0; }
    .per-student-degree { color: var(--text-muted); font-weight: 400; }
    .per-student-city { flex: 0 0 180px; }
    @media (max-width: 540px) { .per-student-row { flex-direction: column; align-items: stretch; } .per-student-city { flex: none; width: 100%; } }

    .dl-btn {
      display: inline-block;
      margin-top: .75rem;
      padding: .6rem 1.25rem;
      background: #48bb78;
      color: #fff;
      font-size: .9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
    }
    .dl-btn:hover { background: #2f855a; }

    .pr-info-row {
      display: flex;
      gap: .65rem;
      margin-bottom: .75rem;
      flex-wrap: wrap;
    }
    .pr-info-row input {
      flex: 1;
      min-width: 100px;
      padding: .5rem .7rem;
      border-radius: 7px;
      border: 1.5px solid var(--border-mid);
      background: var(--bg);
      color: var(--text);
      font-size: .875rem;
      outline: none;
      transition: border-color .2s;
    }
    .pr-info-row input:focus { border-color: var(--accent); }
  </style>
</head>

  <header>
    <h1>Commencement</h1>
    <p>Upload a file for each section you want to generate.</p>
  </header>

  <!-- Commencement Program -->
  <div class="upload-section">
    <div class="section-title">&#x1F4DC; Commencement Program</div>
    <div class="drop-zone" id="dropZone1">
      <label for="csvInput1" style="cursor:pointer;display:block;">
        <span class="upload-icon">&#x1F4C2;</span>
        <p>Drag &amp; drop a <strong>.csv or .xlsx</strong> file here, or <span>click to browse</span></p>
        <input type="file" id="csvInput1" accept=".csv,.xlsx" />
      </label>
    </div>
    <div class="alert" id="alert1"></div>
    <div id="programOutput"></div>
  </div>

  <!-- Commencement Press Release -->
  <div class="upload-section">
    <div class="section-title">&#x1F4F0; Commencement Press Release</div>
    <div class="pr-info-row">
      <input type="text" id="prYear"     placeholder="Year (e.g. 2025)" maxlength="9" />
      <input type="text" id="prGradDate" placeholder="Graduation date (e.g. Thursday, June 12)" />
      <input type="text" id="prGradTime" placeholder="Time (e.g. 5:30 pm)" />
    </div>
    <div class="drop-zone" id="dropZone2">
      <label for="csvInput2" style="cursor:pointer;display:block;">
        <span class="upload-icon">&#x1F4C2;</span>
        <p>Drag &amp; drop a <strong>.txt</strong> file here, or <span>click to browse</span></p>
        <input type="file" id="csvInput2" accept=".txt,.csv,.xlsx" />
      </label>
    </div>
    <div class="alert" id="alert2"></div>
    <div id="pressReleaseOutput"></div>
  </div>

  <!-- Elected Officials List -->
  <div class="upload-section">
    <div class="section-title">&#x1F3DB; Elected Officials List</div>
    <div class="drop-zone" id="dropZone3">
      <label for="csvInput3" style="cursor:pointer;display:block;">
        <span class="upload-icon">&#x1F4C2;</span>
        <p>Drag &amp; drop a <strong>.csv</strong> file here, or <span>click to browse</span></p>
        <input type="file" id="csvInput3" accept=".csv,.xlsx" />
      </label>
    </div>
    <div class="alert" id="alert3"></div>
  </div>
</div>

<script>
(function () {
  const themeToggle = document.getElementById("themeToggle");
  themeToggle.addEventListener("click", () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
    themeToggle.textContent = isDark ? "\uD83C\uDF19 Dark" : "\u2600 Light";
  });

  [1, 2, 3].forEach(n => {
    const dropZone = document.getElementById(`dropZone${n}`);
    const csvInput = document.getElementById(`csvInput${n}`);
    const alertBox = document.getElementById(`alert${n}`);

    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file, n, alertBox);
    });
    csvInput.addEventListener("change", e => {
      if (e.target.files[0]) handleFile(e.target.files[0], n, alertBox);
    });
  });

  const DEGREE_KEYWORDS = /\b(certificate|associate|diploma|technology)\b/i;
  const NAME_SUFFIXES   = /^(jr\.?|sr\.?|ii|iii|iv|v|vi)$/i;

  function handleFile(file, zoneNum, alertBox) {
    const name = file.name.toLowerCase();
    if (name.endsWith(".xlsx")) {
      const reader = new FileReader();
      reader.onload = e => {
        const workbook = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        if (zoneNum === 1) {
          processProgramXlsx(workbook, file.name, alertBox);
        } else {
          showAlert(alertBox, "success", `\u2713 "${file.name}" uploaded successfully.`);
        }
      };
      reader.readAsArrayBuffer(file);
      return;
    }
    if (zoneNum === 2 && name.endsWith(".txt")) {
      const prYear     = document.getElementById("prYear").value.trim();
      const prGradDate = document.getElementById("prGradDate").value.trim();
      const prGradTime = document.getElementById("prGradTime").value.trim();
      if (!prYear)     { showAlert(alertBox, "error", "Please enter the graduation year before uploading."); return; }
      if (!prGradDate) { showAlert(alertBox, "error", "Please enter the graduation date before uploading."); return; }
      if (!prGradTime) { showAlert(alertBox, "error", "Please enter the graduation time before uploading."); return; }
      const reader = new FileReader();
      reader.onload = e => parsePressReleaseTxt(e.target.result, file.name, alertBox);
      reader.readAsText(file);
      return;
    }
    if (!name.endsWith(".csv")) {
      showAlert(alertBox, "error", "Please upload a .csv or .xlsx file.");
      return;
    }
    showAlert(alertBox, "success", `\u2713 "${file.name}" uploaded successfully.`);
  }

  // \u2500\u2500 Commencement Press Release (.txt \u2192 PDF) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500

  const PR_DEGREE_RE = /,\s*(Associate|Certificate|Science|Arts|General|Applied)/i;

  function parsePressReleaseTxt(text, filename, alertBox) {
    const rawLines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");

    // Extract student/degree counts and remove those lines from the content
    const studentRe = /(\d[\d,]*)\s+students?\b/i;
    const degreeRe  = /(\d[\d,]*)\s+degrees?\s+and\s+certificates?\b/i;
    let studentCount = null, degreeCount = null;
    const lines = rawLines.filter(line => {
      const s = line.trim();
      let m;
      if ((m = s.match(studentRe))) { studentCount = m[1]; return false; }
      if ((m = s.match(degreeRe)))  { degreeCount  = m[1]; return false; }
      return true;
    });
    window._prStudentCount = studentCount;
    window._prDegreeCount  = degreeCount;

    // Group consecutive non-blank lines into paragraphs
    const paragraphs = [];
    let current = [];
    for (const line of lines) {
      if (line.trim() === "") {
        if (current.length > 0) { paragraphs.push(current); current = []; }
      } else {
        current.push(line);
      }
    }
    if (current.length > 0) paragraphs.push(current);

    const cities = [];
    for (const para of paragraphs) {
      const cityLine = para[0].trim();
      // Skip if first line looks like a student entry (has degree keywords after a comma)
      if (PR_DEGREE_RE.test(cityLine)) continue;

      // Join remaining lines into one string, collapse whitespace, split on ";"
      const studentText = para.slice(1).join(" ");
      const entries = studentText
        .split(";")
        .map(e => e.replace(/[ \t]+/g, " ").trim())
        .filter(e => e.length > 0);

      cities.push({ city: cityLine, students: entries });
    }

    const total = cities.reduce((s, c) => s + c.students.length, 0);
    showAlert(alertBox, "success",
      `\u2713 "${filename}" parsed \u2014 ${total} student${total !== 1 ? "s" : ""} in ${cities.length} cit${cities.length !== 1 ? "ies" : "y"}.`
    );
    prCheckProblemCities(cities);
  }

  // ── Press Release review pipeline ─────────────────────────────────────────

  function isTitleCase(str) {
    return str.trim().split(/\s+/).every(w => w.length <= 2 || /^[A-Z][^A-Z]/.test(w));
  }
  function toTitleCase(str) {
    return str.trim().split(/\s+/).map(w => w.length === 0 ? w : w[0].toUpperCase() + w.slice(1).toLowerCase()).join(" ");
  }

  // Step 1: city headers that need manual correction (missing state, zip code, blank)
  function prCheckProblemCities(cities) {
    window._prPendingCities = cities;
    const problems = [];
    cities.forEach((c, i) => {
      const raw = c.city.trim();
      const commaIdx = raw.indexOf(",");
      const cityPart = (commaIdx !== -1 ? raw.slice(0, commaIdx) : raw).trim();
      const statePart = commaIdx !== -1 ? raw.slice(commaIdx + 1).trim() : "";
      if (cityPart === "" && commaIdx !== -1) {
        problems.push({ i, city: c.city, students: c.students, type: "blank", cityPart, statePart });
      } else if (/^\d[\d-]*$/.test(cityPart)) {
        problems.push({ i, city: c.city, students: c.students, type: "zipcode", cityPart, statePart });
      } else if (commaIdx !== -1 && statePart === "") {
        problems.push({ i, city: c.city, students: c.students, type: "missing-state", cityPart, statePart });
      }
    });
    if (problems.length) {
      prRenderProblemCities(problems, cities);
    } else {
      prCheckCityCasing(cities);
    }
  }

  function prGetCitySuggestion(prefix, allCities) {
    const norm = prefix.toLowerCase();
    for (const c of allCities) {
      const parts = c.city.split(",");
      if (parts.length >= 2 && parts[0].trim().toLowerCase() === norm && parts[1].trim() !== "") {
        return c.city;
      }
    }
    return null;
  }

  function prRenderProblemCities(problems, allCities) {
    const output = document.getElementById("pressReleaseOutput");
    let html = `<div class="conflicts-wrap show"><h2>&#x26A0; Some locations need attention — please fill in</h2><div id="prProblemCards">`;
    problems.forEach(p => {
      // Blank location with multiple students: show a per-student input row immediately
      if (p.type === "blank" && p.students.length > 1) {
        html += `<div class="conflict-card" data-city-index="${p.i}" data-per-student="true">`;
        html += `<p>Blank location — assign each student individually:</p>`;
        p.students.forEach((student, si) => {
          const commaIdx = student.indexOf(",");
          const namePart   = esc(commaIdx !== -1 ? student.slice(0, commaIdx).trim() : student.trim());
          const degreePart = commaIdx !== -1 ? esc(student.slice(commaIdx + 1).trim()) : "";
          html += `<div class="per-student-row">`;
          html += `<div class="per-student-name"><strong>${namePart}</strong>${degreePart ? `<span class="per-student-degree">, ${degreePart}</span>` : ""}</div>`;
          html += `<input class="city-input per-student-city" type="text" value="" placeholder="e.g. Albany, OR" data-student-index="${si}">`;
          html += `</div>`;
        });
        html += `</div>`;
        return;
      }

      // All other problem types: single city input
      let desc = "";
      let defaultVal = "";
      let placeholder = "e.g. Albany, OR";
      let suggestion = null;
      if (p.type === "blank") {
        desc = "Blank location (just a comma):";
      } else if (p.type === "zipcode") {
        desc = `ZIP code instead of city name: <strong>${esc(p.city)}</strong>`;
        placeholder = p.statePart ? `e.g. Eugene, ${esc(p.statePart)}` : "e.g. Eugene, OR";
      } else {
        desc = `Missing state: <strong>${esc(p.city)}</strong>`;
        suggestion = prGetCitySuggestion(p.cityPart, allCities);
        defaultVal = suggestion || p.cityPart + ", ";
        placeholder = p.cityPart + ", OR";
      }
      const names = p.students.map(s => { const ci = s.indexOf(","); return esc(ci !== -1 ? s.slice(0, ci).trim() : s.trim()); });
      html += `<div class="conflict-card" data-city-index="${p.i}">`;
      html += `<p>${desc}</p>`;
      html += `<ul class="problem-students">${names.map(n => `<li>${n}</li>`).join("")}</ul>`;
      html += `<input class="city-input" type="text" value="${esc(defaultVal)}" placeholder="${placeholder}">`;
      if (suggestion) html += `<p class="city-suggestion">Suggested based on <strong>${esc(suggestion)}</strong> already in the list</p>`;
      html += `</div>`;
    });
    html += `</div><button class="apply-btn" id="prApplyProblemBtn">Apply &amp; continue</button></div>`;
    output.innerHTML = html;

    document.getElementById("prApplyProblemBtn").addEventListener("click", () => {
      const cards = document.querySelectorAll("#prProblemCards .conflict-card");
      let cities2 = window._prPendingCities.map(c => ({ ...c, students: [...c.students] }));
      const multiStudentFixes = [];
      const perStudentExpansions = [];

      cards.forEach(card => {
        const idx = parseInt(card.dataset.cityIndex);
        if (card.dataset.perStudent === "true") {
          // Blank multi-student: collect per-student cities and expand inline
          const inputs = card.querySelectorAll(".per-student-city");
          const grouped = new Map();
          cities2[idx].students.forEach((student, si) => {
            const city = inputs[si]?.value.trim();
            if (!city) return;
            if (!grouped.has(city)) grouped.set(city, []);
            grouped.get(city).push(student);
          });
          if (grouped.size) perStudentExpansions.push({ idx, grouped });
        } else {
          const val = card.querySelector(".city-input").value.trim();
          if (!val) return;
          cities2[idx] = { ...cities2[idx], city: val };
          if (cities2[idx].students.length > 1) {
            multiStudentFixes.push({ cityIndex: idx, newCity: val, students: [...cities2[idx].students] });
          }
        }
      });

      // Expand blank per-student entries in-place, preserving array order
      if (perStudentExpansions.length) {
        const expandSet = new Set(perStudentExpansions.map(e => e.idx));
        const expanded = [];
        for (let i = 0; i < cities2.length; i++) {
          if (expandSet.has(i)) {
            const exp = perStudentExpansions.find(e => e.idx === i);
            for (const [city, students] of exp.grouped) expanded.push({ city, students });
          } else {
            expanded.push(cities2[i]);
          }
        }
        cities2 = expanded;
      }

      if (multiStudentFixes.length) {
        prPerStudentAssign(multiStudentFixes, cities2);
      } else {
        prCheckCityCasing(cities2);
      }
    });
  }

  // Step 1b: per-student city assignment for multi-student problem locations
  function prPerStudentAssign(fixes, baseCities) {
    window._prPendingCities = baseCities;
    window._prPerStudentFixes = fixes;
    const output = document.getElementById("pressReleaseOutput");
    let html = `<div class="conflicts-wrap show"><h2>&#x26A0; Multiple students share the same location — confirm or assign individually</h2><div id="prPerStudentCards">`;
    fixes.forEach((fix, fi) => {
      html += `<div class="conflict-card" data-fix-index="${fi}">`;
      html += `<p>Location confirmed as: <strong>${esc(fix.newCity)}</strong></p>`;
      fix.students.forEach((student, si) => {
        const commaIdx = student.indexOf(",");
        const namePart  = esc(commaIdx !== -1 ? student.slice(0, commaIdx).trim() : student.trim());
        const degreePart = commaIdx !== -1 ? esc(student.slice(commaIdx + 1).trim()) : "";
        html += `<div class="per-student-row">`;
        html += `<div class="per-student-name"><strong>${namePart}</strong>${degreePart ? `<span class="per-student-degree">, ${degreePart}</span>` : ""}</div>`;
        html += `<input class="city-input per-student-city" type="text" value="${esc(fix.newCity)}" data-fix-index="${fi}" data-student-index="${si}">`;
        html += `</div>`;
      });
      html += `</div>`;
    });
    html += `</div><button class="apply-btn" id="prApplyPerStudentBtn">Confirm &amp; continue</button></div>`;
    output.innerHTML = html;

    document.getElementById("prApplyPerStudentBtn").addEventListener("click", () => {
      const fixes2 = window._prPerStudentFixes;
      const cities2 = window._prPendingCities;
      // Rebuild cities: expand each multi-student entry in-place by its per-student assignments
      const result = [];
      for (let i = 0; i < cities2.length; i++) {
        const fix = fixes2.find(f => f.cityIndex === i);
        if (!fix) { result.push(cities2[i]); continue; }
        // Group students by their individually assigned city
        const inputs = document.querySelectorAll(`.per-student-city[data-fix-index="${fixes2.indexOf(fix)}"]`);
        const grouped = new Map();
        fix.students.forEach((student, si) => {
          const city = (inputs[si]?.value.trim()) || fix.newCity;
          if (!grouped.has(city)) grouped.set(city, []);
          grouped.get(city).push(student);
        });
        for (const [city, students] of grouped) result.push({ city, students });
      }
      prCheckCityCasing(result);
    });
  }

  // Step 2: city name casing (e.g. "MILWAUKEE, WI" or "ben lomond, CA")
  function prCheckCityCasing(cities) {
    window._prPendingCities = cities;
    const flagged = cities.map((c, i) => {
      const commaIdx = c.city.indexOf(",");
      const cityPart = (commaIdx !== -1 ? c.city.slice(0, commaIdx) : c.city).trim();
      const statePart = commaIdx !== -1 ? c.city.slice(commaIdx) : "";
      if (!isTitleCase(cityPart)) {
        return { i, city: c.city, suggested: toTitleCase(cityPart) + statePart };
      }
      return null;
    }).filter(Boolean);

    if (flagged.length) {
      prRenderCityCasing(flagged);
    } else {
      prReviewAndFinalize(cities);
    }
  }

  function prRenderCityCasing(flagged) {
    const output = document.getElementById("pressReleaseOutput");
    let html = `<div class="conflicts-wrap show"><h2>&#x26A0; Some location names may not be in title case — please review</h2><div id="prCasingCards">`;
    flagged.forEach((f, fi) => {
      html += `<div class="conflict-card" data-city-index="${f.i}">`;
      html += `<p>Original: <strong>${esc(f.city)}</strong></p>`;
      html += `<div class="conflict-options">`;
      html += `<label><input type="radio" name="prcc_${fi}" value="suggested" checked><span>${esc(f.suggested)}</span><span class="badge">title case</span></label>`;
      html += `<label><input type="radio" name="prcc_${fi}" value="original"><span>${esc(f.city)}</span><span class="badge">keep original</span></label>`;
      html += `</div></div>`;
    });
    html += `</div><button class="apply-btn" id="prApplyCasingBtn">Apply selections &amp; continue</button></div>`;
    output.innerHTML = html;

    document.getElementById("prApplyCasingBtn").addEventListener("click", () => {
      const cards = document.querySelectorAll("#prCasingCards .conflict-card");
      const cities2 = window._prPendingCities.map(c => ({ ...c }));
      cards.forEach((card, fi) => {
        const checked = card.querySelector(`input[name="prcc_${fi}"]:checked`);
        if (!checked || checked.value === "original") return;
        const idx = parseInt(card.dataset.cityIndex);
        cities2[idx] = { ...cities2[idx], city: flagged[fi].suggested };
      });
      prReviewAndFinalize(cities2);
    });
  }

  // Step 3: city spelling conflicts
  function prReviewAndFinalize(cities) {
    window._prPendingCities = cities;
    const conflicts = prDetectCityConflicts(cities);
    if (conflicts.length) {
      prRenderCityConflicts(conflicts);
    } else {
      prCheckNames(cities);
    }
  }

  function prDetectCityConflicts(cities) {
    const groups = new Map();
    for (const c of cities) {
      const normKey = c.city.toLowerCase().trim();
      if (!groups.has(normKey)) groups.set(normKey, new Map());
      groups.get(normKey).set(c.city, (groups.get(normKey).get(c.city) || 0) + c.students.length);
    }
    const conflicts = [];
    for (const [normKey, variants] of groups) {
      if (variants.size > 1) {
        conflicts.push({ normKey, variants: [...variants.entries()].map(([city, count]) => ({ city, count })) });
      }
    }
    return conflicts;
  }

  function prRenderCityConflicts(conflicts) {
    const output = document.getElementById("pressReleaseOutput");
    let html = `<div class="conflicts-wrap show"><h2>&#x26A0; Possible duplicate locations — please review</h2><div id="prConflictCards">`;
    conflicts.forEach((c, ci) => {
      html += `<div class="conflict-card"><p>These appear to be the same location — which spelling should be used?</p><div class="conflict-options">`;
      const maxCount = Math.max(...c.variants.map(v => v.count));
      c.variants.forEach((v, vi) => {
        const checked = (v.count === maxCount && vi === c.variants.findIndex(x => x.count === maxCount)) ? "checked" : "";
        html += `<label><input type="radio" name="prcf_${ci}" value="${esc(v.city)}" ${checked}><span>${esc(v.city)}</span><span class="badge">${v.count} student${v.count !== 1 ? "s" : ""}</span></label>`;
      });
      html += `<label><input type="radio" name="prcf_${ci}" value="__keep__"><span>Keep separate</span></label>`;
      html += `</div></div>`;
    });
    html += `</div><button class="apply-btn" id="prApplyCityBtn">Apply selections &amp; continue</button></div>`;
    output.innerHTML = html;

    document.getElementById("prApplyCityBtn").addEventListener("click", () => {
      const cards = document.querySelectorAll("#prConflictCards .conflict-card");
      const resolutions = new Map();
      cards.forEach((card, ci) => {
        const checked = card.querySelector(`input[name="prcf_${ci}"]:checked`);
        if (checked && checked.value !== "__keep__") resolutions.set(conflicts[ci].normKey, checked.value);
      });
      const pending = window._prPendingCities;
      const merged = [];
      const seenNorm = new Map();
      for (const cityObj of pending) {
        const normKey = cityObj.city.toLowerCase().trim();
        const canonical = resolutions.has(normKey) ? resolutions.get(normKey) : cityObj.city;
        const mergeKey = canonical.toLowerCase();
        if (seenNorm.has(mergeKey)) {
          merged[seenNorm.get(mergeKey)].students.push(...cityObj.students);
        } else {
          seenNorm.set(mergeKey, merged.length);
          merged.push({ city: canonical, students: [...cityObj.students] });
        }
      }
      prCheckNames(merged);
    });
  }

  function prCheckNames(cities) {
    window._prPendingCities = cities;
    const flagged = prFindNameIssues(cities);
    if (flagged.length) {
      prRenderNameReview(flagged);
    } else {
      prFinalize(cities);
    }
  }

  function prFindNameIssues(cities) {
    const flagged = [];
    cities.forEach((cityObj, ci) => {
      cityObj.students.forEach((entry, si) => {
        const commaIdx = entry.indexOf(",");
        const namePart = (commaIdx !== -1 ? entry.slice(0, commaIdx) : entry).trim();
        if (!isTitleCase(namePart)) flagged.push({ ci, si, namePart, suggested: toTitleCase(namePart), entry });
      });
    });
    return flagged;
  }

  function prRenderNameReview(flagged) {
    const output = document.getElementById("pressReleaseOutput");
    let html = `<div class="conflicts-wrap show"><h2>&#x26A0; Some names may not be in title case — please review</h2><div id="prNameCards">`;
    flagged.forEach((f, fi) => {
      html += `<div class="conflict-card" data-ci="${f.ci}" data-si="${f.si}" data-name="${esc(f.namePart)}">`;
      html += `<p>Original: <strong>${esc(f.namePart)}</strong></p><div class="conflict-options">`;
      html += `<label><input type="radio" name="prnm_${fi}" value="suggested" checked><span>${esc(f.suggested)}</span><span class="badge">suggested</span></label>`;
      html += `<label><input type="radio" name="prnm_${fi}" value="original"><span>${esc(f.namePart)}</span><span class="badge">keep original</span></label>`;
      html += `</div></div>`;
    });
    html += `</div><button class="apply-btn" id="prApplyNamesBtn">Apply selections &amp; continue</button></div>`;
    output.innerHTML = html;

    document.getElementById("prApplyNamesBtn").addEventListener("click", () => {
      const cards = document.querySelectorAll("#prNameCards .conflict-card");
      const cities2 = window._prPendingCities.map(c => ({ ...c, students: [...c.students] }));
      cards.forEach((card, fi) => {
        const checked = card.querySelector(`input[name="prnm_${fi}"]:checked`);
        if (!checked || checked.value === "original") return;
        const ci = parseInt(card.dataset.ci);
        const si = parseInt(card.dataset.si);
        const origName = card.dataset.name;
        const entry = cities2[ci].students[si];
        const commaIdx = entry.indexOf(",");
        const degreePart = commaIdx !== -1 ? entry.slice(commaIdx) : "";
        cities2[ci].students[si] = toTitleCase(origName) + degreePart;
      });
      prFinalize(cities2);
    });
  }

  function prFinalize(cities) {
    // Merge any entries that share the same city name (case-insensitive)
    const mergeMap = new Map();
    const merged = [];
    for (const c of cities) {
      const key = c.city.toLowerCase().trim();
      if (mergeMap.has(key)) {
        merged[mergeMap.get(key)].students.push(...c.students);
      } else {
        mergeMap.set(key, merged.length);
        merged.push({ city: c.city, students: [...c.students] });
      }
    }
    const sorted = merged.sort((a, b) => a.city.localeCompare(b.city, undefined, { sensitivity: "base" }));
    window._pressReleaseData = sorted;
    document.getElementById("pressReleaseOutput").innerHTML =
      `<button class="dl-btn" onclick="generatePressReleasePdf()">&#x2B07; Download Press Release PDF</button>`;
  }

  window.generatePressReleasePdf = function generatePressReleasePdf() {
    const cities = window._pressReleaseData;
    if (!cities) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });

    const marginL = 72, marginR = 72, marginT = 72;
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const maxW  = pageW - marginL - marginR;
    let y = marginT;

    function checkPageBreak(needed) {
      if (y + needed > pageH - 56) { doc.addPage(); y = marginT; }
    }

    // Logo (grab full-color version from DOM)
    const logoImg = document.querySelector(".logo-light");
    if (logoImg && logoImg.src.includes("base64,")) {
      const logoBase64 = logoImg.src.split("base64,")[1];
      const logoW = 216, logoH = 64;
      doc.addImage(logoBase64, "PNG", (pageW - logoW) / 2, y, logoW, logoH);
      y += logoH + 10;
    }

    // Contact block
    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    doc.text("FOR IMMEDIATE RELEASE", marginL, y); y += 15;
    doc.text("Media Contact: Matt Scotton", marginL, y); y += 15;
    doc.text("541-514-1054", marginL, y); y += 22;

    // Centered bold title
    const prYear         = document.getElementById("prYear").value.trim();
    const prGradDate     = document.getElementById("prGradDate").value.trim();
    const prGradTime     = document.getElementById("prGradTime").value.trim();
    const ceremonyOrdinal = ordinalSuffix(parseInt(prYear) - 1969);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    ["Linn-Benton Community College", `Congratulates its ${ceremonyOrdinal} Graduating Class`].forEach(line => {
      checkPageBreak(22);
      doc.text(line, pageW / 2, y, { align: "center" });
      y += 22;
    });
    y += 10;

    // Body paragraphs
    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    const studentCount = window._prStudentCount || "XXX";
    const degreeCount  = window._prDegreeCount  || "XXX";
    const body1 = `ALBANY, Ore. \u2013 Linn-Benton Community College will hold its ${ceremonyOrdinal} commencement ceremony on ${prGradDate}, at ${prGradTime} on the Albany campus. The class of ${prYear} features ${studentCount} candidates for graduation and LBCC expects to award ${degreeCount} degrees and certificates to these students.`;
    const body2 = "Graduates are listed alphabetically under their hometown:";

    doc.splitTextToSize(body1, maxW).forEach(line => {
      checkPageBreak(16); doc.text(line, marginL, y); y += 16;
    });
    y += 10;
    doc.splitTextToSize(body2, maxW).forEach(line => {
      checkPageBreak(16); doc.text(line, marginL, y); y += 16;
    });
    y += 14;

    // City sections
    for (const { city, students } of cities) {
      checkPageBreak(28);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.text(city, marginL, y);
      y += 18;

      doc.setFont("helvetica", "normal");
      doc.setFontSize(11);
      for (const student of students) {
        const entry = `\u2022  ${student}`;
        const lines = doc.splitTextToSize(entry, maxW - 12);
        checkPageBreak(lines.length * 15);
        doc.text(lines, marginL + 10, y);
        y += lines.length * 15;
      }
      y += 8;
    }

    doc.save("Commencement_Press_Release.pdf");
  }

  function processProgramXlsx(workbook, filename, alertBox) {
    const sections = [];

    workbook.SheetNames.forEach(sheetName => {
      const sheet = workbook.Sheets[sheetName];
      const allRows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      // Detect whether this tab has any indented rows (degree detail lines)
      const hasIndentedRows = allRows.slice(2).some(row => {
        const c = row[0];
        if (c == null) return false;
        const s = String(c);
        return s.startsWith(" ") || s.startsWith("\t");
      });

      const names = [];
      // Row 0 = section header, Row 1 = blank \u2014 start at index 2
      for (let i = 2; i < allRows.length; i++) {
        const c = allRows[i][0];
        if (c == null) continue;
        const cellStr = String(c);

        if (cellStr.trim() === "") continue;
        if (cellStr.startsWith(" ") || cellStr.startsWith("\t")) continue;
        if (DEGREE_KEYWORDS.test(cellStr)) continue;

        if (!hasIndentedRows) {
          // GED/ELA-style tab: all remaining rows are student names
          names.push(cellStr.trim());
        } else {
          // Tab has degree detail rows: a student row is immediately followed by an indented row
          const nextC = allRows[i + 1] ? allRows[i + 1][0] : null;
          const nextStr = nextC != null ? String(nextC) : "";
          if (nextStr.startsWith(" ") || nextStr.startsWith("\t")) {
            names.push(cellStr.trim());
          }
          // Otherwise it's a degree subheading \u2014 skip
        }
      }

      names.sort((a, b) => {
        const la = lastNameKey(a);
        const lb = lastNameKey(b);
        return la < lb ? -1 : la > lb ? 1 : 0;
      });

      if (names.length > 0) sections.push({ title: sheetName, names });
    });

    const total = sections.reduce((s, sec) => s + sec.names.length, 0);
    showAlert(alertBox, "success",
      `\u2713 "${filename}" uploaded \u2014 ${total} student${total !== 1 ? "s" : ""} across ${sections.length} section${sections.length !== 1 ? "s" : ""}.`
    );
    renderProgramOutput(sections);
  }

  function lastNameKey(name) {
    const tokens = name.trim().split(/\s+/);
    while (tokens.length > 1 && NAME_SUFFIXES.test(tokens[tokens.length - 1])) {
      tokens.pop();
    }
    return tokens[tokens.length - 1].toLowerCase();
  }

  function renderProgramOutput(sections) {
    const output = document.getElementById("programOutput");
    if (!sections.length) { output.innerHTML = ""; return; }

    let html = "";
    sections.forEach(sec => {
      html += `<div class="prog-section">`;
      html += `<h3 class="prog-section-title">${esc(sec.title)}</h3>`;
      html += `<ul class="prog-names">`;
      sec.names.forEach(n => { html += `<li>${esc(n)}</li>`; });
      html += `</ul></div>`;
    });
    output.innerHTML = html;
  }

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function ordinalSuffix(n) {
    const last2 = n % 100, last1 = n % 10;
    if (last2 >= 11 && last2 <= 13) return n + "th";
    if (last1 === 1) return n + "st";
    if (last1 === 2) return n + "nd";
    if (last1 === 3) return n + "rd";
    return n + "th";
  }

  function showAlert(box, type, msg) {
    box.className = `alert ${type} show`;
    box.textContent = msg;
  }
})();
</script>
</body>
</html>
