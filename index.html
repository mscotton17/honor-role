<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LBCC Toolbox</title>
  <style>
    :root, [data-theme="light"] {
      --bg:          #f0f4f8;
      --card-bg:     #ffffff;
      --card-shadow: 0 4px 24px rgba(0,0,0,.10);
      --text:        #1a202c;
      --text-muted:  #718096;
      --border:      #e2e8f0;
      --toggle-bg:   #e2e8f0;
      --toggle-color:#4a5568;
      --btn-bg:      #4299e1;
      --btn-hover:   #2b6cb0;
      --btn-dis-bg:  #e2e8f0;
      --btn-dis-text:#a0aec0;
      --btn-dis-bd:  #cbd5e0;
    }

    [data-theme="dark"] {
      --bg:          #0f1117;
      --card-bg:     #1a1d27;
      --card-shadow: 0 4px 32px rgba(0,0,0,.50);
      --text:        #e2e8f0;
      --text-muted:  #718096;
      --border:      #2d3748;
      --toggle-bg:   #2d3748;
      --toggle-color:#e2e8f0;
      --btn-bg:      #63b3ed;
      --btn-hover:   #4299e1;
      --btn-dis-bg:  #2d3748;
      --btn-dis-text:#4a5568;
      --btn-dis-bd:  #4a5568;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: background .25s;
    }

    #themeToggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--toggle-bg);
      color: var(--toggle-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .4rem .75rem;
      font-size: .85rem;
      cursor: pointer;
      transition: background .2s, color .2s;
      z-index: 100;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 3rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      transition: background .25s, box-shadow .25s;
    }

    .logo {
      max-width: 260px;
      height: auto;
      margin: 0 auto 2rem;
      display: block;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: .5rem;
    }

    .subtitle {
      font-size: .95rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: 1.5rem 1rem;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s, transform .15s, box-shadow .15s;
    }

    .tool-btn .tool-icon { font-size: 1.75rem; }

    .tool-btn.active {
      background: var(--btn-bg);
      color: #fff;
    }
    .tool-btn.active:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,.15);
    }

    .tool-btn.disabled {
      background: var(--btn-dis-bg);
      color: var(--btn-dis-text);
      border: 1.5px dashed var(--btn-dis-bd);
      cursor: not-allowed;
    }

    .coming-soon {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .05em;
      text-transform: uppercase;
      opacity: .7;
    }
  </style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle light/dark mode">☀ Light</button>

<div class="card">
  <img src="LBCC-horizontal-logo-full-color-cmyk.png" alt="Linn-Benton Community College" class="logo" />
  <h1>LBCC Toolbox</h1>
  <p class="subtitle">Select a tool to get started.</p>

  <div class="tool-grid">
    <a href="honor-roll.html" class="tool-btn active">
      <span class="tool-icon">🎓</span>
      Honor Roll
    </a>
    <button class="tool-btn disabled" disabled>
      <span class="tool-icon">🎉</span>
      Commencement
      <span class="coming-soon">Coming Soon</span>
    </button>
  </div>
</div>

<script>
  const themeToggle = document.getElementById("themeToggle");
  themeToggle.addEventListener("click", () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
    themeToggle.textContent = isDark ? "🌙 Dark" : "☀ Light";
  });
</script>
</body>
</html>
