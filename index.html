<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honor Roll Press Release</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ── Theme tokens ───────────────────────────────────────────────────────── */
    :root, [data-theme="light"] {
      --bg:           #f0f4f8;
      --card-bg:      #ffffff;
      --card-shadow:  0 4px 24px rgba(0,0,0,.10);
      --text:         #1a202c;
      --text-muted:   #718096;
      --text-body:    #2d3748;
      --text-soft:    #4a5568;
      --border:       #e2e8f0;
      --border-mid:   #cbd5e0;
      --thead-bg:     #edf2f7;
      --drop-hover-bg:#ebf8ff;
      --drop-hover-bd:#4299e1;
      --accent:       #4299e1;
      --accent-dark:  #2b6cb0;
      --badge-bg:     #e2e8f0;
      --badge-color:  #4a5568;
      --conflict-bg:  #fefcbf;
      --conflict-bd:  #f6e05e;
      --conflict-text:#744210;
      --toggle-bg:    #e2e8f0;
      --toggle-color: #4a5568;
    }

    [data-theme="dark"] {
      --bg:           #0f1117;
      --card-bg:      #1a1d27;
      --card-shadow:  0 4px 32px rgba(0,0,0,.50);
      --text:         #e2e8f0;
      --text-muted:   #718096;
      --text-body:    #cbd5e0;
      --text-soft:    #a0aec0;
      --border:       #2d3748;
      --border-mid:   #4a5568;
      --thead-bg:     #2d3748;
      --drop-hover-bg:#1a2744;
      --drop-hover-bd:#63b3ed;
      --accent:       #63b3ed;
      --accent-dark:  #4299e1;
      --badge-bg:     #2d3748;
      --badge-color:  #a0aec0;
      --conflict-bg:  #2d2a0f;
      --conflict-bd:  #975a16;
      --conflict-text:#f6e05e;
      --toggle-bg:    #2d3748;
      --toggle-color: #e2e8f0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: background .25s, color .25s;
    }

    /* ── Theme toggle button ─────────────────────────────────────────────────── */
    #themeToggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--toggle-bg);
      color: var(--toggle-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .4rem .75rem;
      font-size: .85rem;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
      z-index: 100;
    }
    #themeToggle:hover { border-color: var(--accent); color: var(--accent); }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      padding: 2.5rem 2rem;
      max-width: 680px;
      width: 100%;
      transition: background .25s, box-shadow .25s;
    }

    header {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.75rem;
    }

    header .icon { font-size: 2rem; }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
    }

    header p {
      font-size: .9rem;
      color: var(--text-muted);
      margin-top: .2rem;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border-mid);
      border-radius: 10px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--drop-hover-bd);
      background: var(--drop-hover-bg);
    }

    .drop-zone input[type="file"] { display: none; }

    .drop-zone .upload-icon {
      font-size: 2.5rem;
      margin-bottom: .75rem;
      display: block;
    }

    .drop-zone p { color: var(--text-soft); font-size: .95rem; }
    .drop-zone p span { color: var(--accent); font-weight: 600; }

    /* Term / year row */
    .term-row {
      display: flex;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .term-row select, .term-row input[type="text"] {
      flex: 1;
      padding: .55rem .75rem;
      border-radius: 7px;
      border: 1.5px solid var(--border-mid);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    .term-row select:focus, .term-row input[type="text"]:focus {
      border-color: var(--accent);
    }

    /* Status messages */
    .alert {
      border-radius: 8px;
      padding: .85rem 1rem;
      margin-top: 1.25rem;
      font-size: .9rem;
      display: none;
    }
    .alert.show { display: block; }
    .alert.error   { background: #2d1515; color: #fc8181; border: 1px solid #742a2a; }
    .alert.success { background: #142414; color: #68d391; border: 1px solid #276749; }
    .alert.info    { background: #0f1f35; color: #90cdf4; border: 1px solid #2b4e7a; }

    [data-theme="light"] .alert.error   { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    [data-theme="light"] .alert.success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    [data-theme="light"] .alert.info    { background: #ebf8ff; color: #2b6cb0; border: 1px solid #90cdf4; }

    /* Preview table */
    .preview-wrap {
      margin-top: 1.5rem;
      display: none;
      overflow-x: auto;
    }
    .preview-wrap.show { display: block; }

    .preview-wrap h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: .6rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .875rem;
    }

    thead { background: var(--thead-bg); }
    th, td { padding: .5rem .75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--text-soft); }
    td { color: var(--text-body); }
    tbody tr:last-child td { border-bottom: none; }

    .table-footer {
      font-size: .8rem;
      color: var(--text-muted);
      margin-top: .5rem;
      text-align: right;
    }

    /* Conflict resolution */
    .conflicts-wrap {
      margin-top: 1.5rem;
      display: none;
    }
    .conflicts-wrap.show { display: block; }

    .conflicts-wrap > h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--conflict-text);
      background: var(--conflict-bg);
      border: 1px solid var(--conflict-bd);
      border-radius: 8px;
      padding: .6rem .9rem;
      margin-bottom: .75rem;
    }

    .conflict-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: .75rem;
    }

    .conflict-card p {
      font-size: .85rem;
      color: #718096;
      margin-bottom: .6rem;
    }

    .conflict-options { display: flex; flex-wrap: wrap; gap: .5rem; }

    .conflict-card p { color: var(--text-muted); }

    .conflict-options label {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .4rem .75rem;
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      cursor: pointer;
      font-size: .9rem;
      color: var(--text-body);
      transition: border-color .15s, background .15s;
    }

    .conflict-options label:hover { border-color: var(--accent); background: var(--drop-hover-bg); }

    .conflict-options input[type="radio"]:checked + span {
      font-weight: 600;
      color: var(--accent);
    }

    .conflict-options label:has(input:checked) {
      border-color: var(--accent);
      background: var(--drop-hover-bg);
    }

    .badge {
      font-size: .75rem;
      background: var(--badge-bg);
      color: var(--badge-color);
      border-radius: 99px;
      padding: .1rem .45rem;
    }

    #applyConflictsBtn {
      display: block;
      width: 100%;
      margin-top: .25rem;
      padding: .7rem;
      background: #ed8936;
      color: #fff;
      font-size: .95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
    }
    #applyConflictsBtn:hover { background: #c05621; }

    /* Download buttons */
    .download-row {
      display: none;
      margin-top: 1.5rem;
      gap: .75rem;
    }
    .download-row.show { display: flex; }

    .download-row button {
      flex: 1;
      padding: .85rem;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s;
    }

    #downloadDocx { background: var(--accent); }
    #downloadDocx:hover { background: var(--accent-dark); }

    #downloadPdf { background: #48bb78; }
    #downloadPdf:hover { background: #2f855a; }
  </style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle light/dark mode">☀ Light</button>
<div class="card">
  <header>
    <span class="icon">🎓</span>
    <div>
      <h1>Honor Roll Press Release</h1>
      <p>Upload a student CSV to generate a formatted Word document.</p>
    </div>
  </header>

  <!-- Term / Year -->
  <div class="term-row">
    <select id="termSelect">
      <option value="">— Select Term —</option>
      <option value="Fall Term">Fall Term</option>
      <option value="Winter Term">Winter Term</option>
      <option value="Spring Term">Spring Term</option>
      <option value="Summer Term">Summer Term</option>
    </select>
    <input type="text" id="yearInput" placeholder="Year (e.g. 2026)" maxlength="9" />
  </div>

  <!-- Drop zone -->
  <div class="drop-zone" id="dropZone">
    <label for="csvInput" style="cursor:pointer; display:block;">
      <span class="upload-icon">📂</span>
      <p>Drag &amp; drop a <strong>.csv</strong> file here, or <span>click to browse</span></p>
      <input type="file" id="csvInput" accept=".csv" />
    </label>
  </div>

  <div class="alert" id="alertBox"></div>

  <!-- Conflict resolution -->
  <div class="conflicts-wrap" id="conflictsWrap">
    <h2>⚠ Possible duplicate locations — please review</h2>
    <div id="conflictCards"></div>
    <button id="applyConflictsBtn">Apply selections &amp; continue</button>
  </div>

  <div class="download-row" id="downloadRow">
    <button id="downloadDocx">⬇ Download .docx</button>
    <button id="downloadPdf">⬇ Download .pdf</button>
  </div>

  <!-- Preview -->
  <div class="preview-wrap" id="previewWrap">
    <h2>Preview</h2>
    <table id="previewTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Full Name</th>
          <th>City</th>
          <th>State</th>
        </tr>
      </thead>
      <tbody id="previewBody"></tbody>
    </table>
    <p class="table-footer" id="tableFooter"></p>
  </div>

</div>

<script>
(function () {
  // ── Theme toggle ───────────────────────────────────────────────────────────
  const themeToggle = document.getElementById("themeToggle");
  themeToggle.addEventListener("click", () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
    themeToggle.textContent = isDark ? "🌙 Dark" : "☀ Light";
  });

  const REQUIRED = ["FIRST_NAME", "LAST_NAME", "PHYSICAL_CITY", "PHYSICAL_STATE"];
  const PREVIEW_LIMIT = 50;

  const termSelect       = document.getElementById("termSelect");
  const yearInput        = document.getElementById("yearInput");
  const dropZone         = document.getElementById("dropZone");
  const csvInput         = document.getElementById("csvInput");
  const alertBox         = document.getElementById("alertBox");
  const conflictsWrap    = document.getElementById("conflictsWrap");
  const conflictCards    = document.getElementById("conflictCards");
  const applyConflictsBtn= document.getElementById("applyConflictsBtn");
  const previewWrap      = document.getElementById("previewWrap");
  const previewBody      = document.getElementById("previewBody");
  const tableFooter      = document.getElementById("tableFooter");
  const downloadRow      = document.getElementById("downloadRow");
  const downloadDocx     = document.getElementById("downloadDocx");
  const downloadPdf      = document.getElementById("downloadPdf");

  let processedRows = [];
  let pendingRows   = [];

  // ── Drag & drop ────────────────────────────────────────────────────────────
  dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });
  csvInput.addEventListener("change", e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

  // ── File handling ──────────────────────────────────────────────────────────
  function handleFile(file) {
    if (!termSelect.value.trim()) {
      showAlert("error", "Please select a term before uploading.");
      return;
    }
    if (!yearInput.value.trim()) {
      showAlert("error", "Please enter a year before uploading.");
      return;
    }
    if (!file.name.toLowerCase().endsWith(".csv")) {
      showAlert("error", "Please upload a .csv file.");
      return;
    }
    showAlert("info", "Parsing CSV…");
    resetUI();

    Papa.parse(file, {
      skipEmptyLines: true,
      complete: result => processCSV(result.data),
      error: err => showAlert("error", "Failed to parse CSV: " + err.message)
    });
  }

  function processCSV(rawRows) {
    if (rawRows.length < 2) {
      showAlert("error", "CSV has too few rows.");
      return;
    }

    // Find the header row by scanning for whichever row contains the required columns
    let headerIndex = -1;
    let headerRow   = [];
    for (let i = 0; i < Math.min(rawRows.length, 10); i++) {
      const candidate = rawRows[i].map(h => (h || "").trim());
      if (REQUIRED.every(col => candidate.includes(col))) {
        headerIndex = i;
        headerRow   = candidate;
        break;
      }
    }

    if (headerIndex === -1) {
      showAlert("error", "Missing required columns: " + REQUIRED.join(", "));
      return;
    }

    const dataRows = rawRows.slice(headerIndex + 1);

    const idx = col => headerRow.indexOf(col);

    const rows = dataRows
      .map(r => ({
        first : (r[idx("FIRST_NAME")]    || "").trim(),
        last  : (r[idx("LAST_NAME")]     || "").trim(),
        city  : (r[idx("PHYSICAL_CITY")] || "").trim(),
        state : (r[idx("PHYSICAL_STATE")]|| "").trim(),
      }))
      .filter(r => r.first && r.last && r.city && r.state);

    if (!rows.length) {
      showAlert("error", "No valid student records found after cleaning the data.");
      return;
    }

    // Sort: city → state → last name
    rows.sort((a, b) =>
      a.city.localeCompare(b.city)  ||
      a.state.localeCompare(b.state)||
      a.last.localeCompare(b.last)
    );

    const conflicts = detectConflicts(rows);
    if (conflicts.length) {
      pendingRows = rows;
      renderConflicts(conflicts);
      showAlert("info", `✓ Loaded ${rows.length} records. Found ${conflicts.length} possible duplicate location${conflicts.length > 1 ? "s" : ""} — review below.`);
    } else {
      processedRows = rows;
      renderPreview(rows);
      showAlert("success", `✓ Loaded ${rows.length} student record${rows.length !== 1 ? "s" : ""}.`);
      downloadRow.classList.add("show");
    }
  }

  // ── Conflict detection ─────────────────────────────────────────────────────
  function detectConflicts(rows) {
    // Group by normalized (lowercase) city+state key
    const groups = new Map();
    for (const r of rows) {
      const normKey = r.city.toLowerCase() + "|||" + r.state.toLowerCase();
      if (!groups.has(normKey)) groups.set(normKey, new Map());
      const varKey = r.city + "|||" + r.state;
      const vm = groups.get(normKey);
      vm.set(varKey, (vm.get(varKey) || 0) + 1);
    }
    const conflicts = [];
    for (const [normKey, vm] of groups) {
      if (vm.size > 1) {
        conflicts.push({
          normKey,
          variants: [...vm.entries()].map(([vk, count]) => {
            const [city, state] = vk.split("|||");
            return { city, state, count };
          }),
        });
      }
    }
    return conflicts;
  }

  function renderConflicts(conflicts) {
    conflictCards.innerHTML = "";
    conflicts.forEach((c, ci) => {
      const card = document.createElement("div");
      card.className = "conflict-card";
      const variantHtml = c.variants.map((v, vi) => {
        const id = `cf_${ci}_${vi}`;
        // Pre-select the variant with the most students
        const checked = vi === c.variants.indexOf(c.variants.reduce((a, b) => a.count >= b.count ? a : b)) ? "checked" : "";
        return `<label>
          <input type="radio" name="cf_${ci}" id="${id}" value="${esc(v.city)}|||${esc(v.state)}" ${checked}>
          <span>${esc(v.city)}, ${esc(v.state)}</span>
          <span class="badge">${v.count} student${v.count !== 1 ? "s" : ""}</span>
        </label>`;
      }).join("");
      // "Keep separate" option
      const keepId = `cf_${ci}_keep`;
      card.innerHTML = `<p>These appear to be the same location — which spelling should be used?</p>
        <div class="conflict-options">
          ${variantHtml}
          <label>
            <input type="radio" name="cf_${ci}" id="${keepId}" value="__keep__">
            <span>Keep separate</span>
          </label>
        </div>`;
      conflictCards.appendChild(card);
    });
    conflictsWrap.classList.add("show");
  }

  applyConflictsBtn.addEventListener("click", () => {
    const cards = conflictCards.querySelectorAll(".conflict-card");
    const resolved = new Map(); // normKey → chosen "City|||State" or "__keep__"

    cards.forEach((card, ci) => {
      const checked = card.querySelector(`input[name="cf_${ci}"]:checked`);
      if (!checked) return;
      // Reconstruct normKey from first radio's value
      const firstRadio = card.querySelector(`input[type="radio"]`);
      const [fc, fs] = firstRadio.value.split("|||");
      const normKey = fc.toLowerCase() + "|||" + fs.toLowerCase();
      resolved.set(normKey, checked.value);
    });

    // Apply resolutions to pendingRows
    const finalRows = pendingRows.map(r => {
      const normKey = r.city.toLowerCase() + "|||" + r.state.toLowerCase();
      const choice = resolved.get(normKey);
      if (!choice || choice === "__keep__") return r;
      const [newCity, newState] = choice.split("|||");
      return { ...r, city: newCity, state: newState };
    });

    // Re-sort after normalization
    finalRows.sort((a, b) =>
      a.city.localeCompare(b.city)  ||
      a.state.localeCompare(b.state)||
      a.last.localeCompare(b.last)
    );

    processedRows = finalRows;
    conflictsWrap.classList.remove("show");
    renderPreview(finalRows);
    showAlert("success", `✓ ${finalRows.length} records ready.`);
    downloadRow.classList.add("show");
  });

  // ── Preview table ──────────────────────────────────────────────────────────
  function renderPreview(rows) {
    previewBody.innerHTML = "";
    const shown = rows.slice(0, PREVIEW_LIMIT);
    shown.forEach((r, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${i + 1}</td><td>${esc(r.first + " " + r.last)}</td><td>${esc(r.city)}</td><td>${esc(r.state)}</td>`;
      previewBody.appendChild(tr);
    });
    tableFooter.textContent = rows.length > PREVIEW_LIMIT
      ? `Showing first ${PREVIEW_LIMIT} of ${rows.length} records.`
      : `${rows.length} record${rows.length !== 1 ? "s" : ""} total.`;
    previewWrap.classList.add("show");
  }

  // ── Download ───────────────────────────────────────────────────────────────
  downloadDocx.addEventListener("click", () => {
    generateDocx(processedRows).catch(err => {
      showAlert("error", "Failed to generate .docx: " + err.message);
    });
  });

  downloadPdf.addEventListener("click", () => {
    generatePdf(processedRows).catch(err => {
      showAlert("error", "Failed to generate .pdf: " + err.message);
    });
  });

  function termLabel() {
    const t = termSelect.value.trim();
    const y = yearInput.value.trim();
    if (t && y) return `${t} ${y}`;
    if (t) return t;
    if (y) return y;
    return "Honor_Roll";
  }

  function termLower() {
    return termSelect.value.trim().toLowerCase();
  }

  function termDateRange() {
    const term = termSelect.value.trim().toLowerCase();
    const year = yearInput.value.trim();
    if (term.startsWith("fall"))   return `September ${year} to December ${year}`;
    if (term.startsWith("winter")) return `January ${year} to March ${year}`;
    if (term.startsWith("spring")) return `March ${year} to June ${year}`;
    if (term.startsWith("summer")) return `June ${year} to August ${year}`;
    return "";
  }

  function xmlEsc(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
              .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
  }

  async function generateDocx(rows) {
    const WML  = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
    const WP   = "http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing";
    const A    = "http://schemas.openxmlformats.org/drawingml/2006/main";
    const PIC  = "http://schemas.openxmlformats.org/drawingml/2006/picture";
    const R    = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";

    const termFull  = termLabel();
    const termLow   = termLower();
    const dateRange = termDateRange();

    function rPr(extra = "") {
      return `<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>${extra}</w:rPr>`;
    }
    function pSpacing() {
      return `<w:spacing w:line="240" w:lineRule="auto"/>`;
    }

    // Fetch logo as base64
    let logoBase64 = null;
    try {
      const resp = await fetch("LBCC-horizontal-logo-full-color-cmyk.png");
      if (resp.ok) {
        const buf = await resp.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let bin = "";
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        logoBase64 = btoa(bin);
      }
    } catch (_) {}

    let bodyXml = "";

    // Logo (centered)
    if (logoBase64) {
      bodyXml +=
        `<w:p><w:pPr><w:jc w:val="center"/>${pSpacing()}</w:pPr>` +
        `<w:r>${rPr()}` +
          `<w:drawing><wp:inline xmlns:wp="${WP}" distT="114300" distB="114300" distL="114300" distR="114300">` +
            `<wp:extent cx="2857500" cy="496957"/>` +
            `<wp:effectExtent b="0" l="0" r="0" t="0"/>` +
            `<wp:docPr id="1" name="logo.png"/>` +
            `<a:graphic xmlns:a="${A}"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
              `<pic:pic xmlns:pic="${PIC}">` +
                `<pic:nvPicPr><pic:cNvPr id="0" name="logo.png"/><pic:cNvPicPr preferRelativeResize="0"/></pic:nvPicPr>` +
                `<pic:blipFill><a:blip r:embed="rId6" xmlns:r="${R}"/><a:srcRect b="0" l="0" r="0" t="0"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
                `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="2857500" cy="496957"/></a:xfrm><a:prstGeom prst="rect"/><a:ln/></pic:spPr>` +
              `</pic:pic>` +
            `</a:graphicData></a:graphic>` +
          `</wp:inline></w:drawing>` +
        `</w:r></w:p>`;
    }

    // Blank line after logo
    bodyXml += `<w:p><w:pPr>${pSpacing()}</w:pPr><w:r>${rPr()}</w:r></w:p>`;

    // Contact block
    bodyXml +=
      `<w:p><w:pPr>${pSpacing()}</w:pPr>` +
        `<w:r>${rPr()}<w:t xml:space="preserve">FOR IMMEDIATE RELEASE</w:t><w:br w:type="textWrapping"/>` +
        `<w:t>Media Contact: Matt Scotton</w:t></w:r>` +
      `</w:p>`;

    bodyXml +=
      `<w:p><w:pPr>${pSpacing()}</w:pPr>` +
        `<w:r>${rPr()}<w:t>541-514-1054</w:t></w:r>` +
      `</w:p>`;

    // Blank line
    bodyXml += `<w:p><w:pPr>${pSpacing()}</w:pPr><w:r>${rPr()}</w:r></w:p>`;

    // Headline (centered, bold, 20pt)
    bodyXml +=
      `<w:p><w:pPr>${pSpacing()}<w:jc w:val="center"/></w:pPr>` +
        `<w:r>${rPr(`<w:b/><w:bCs/><w:sz w:val="40"/><w:szCs w:val="40"/>`)}<w:t xml:space="preserve">Linn-Benton Community College Congratulates ${xmlEsc(termFull)} Honor Roll Students</w:t></w:r>` +
      `</w:p>`;

    // Blank line
    bodyXml += `<w:p><w:pPr>${pSpacing()}</w:pPr><w:r>${rPr()}</w:r></w:p>`;

    // Opening paragraph
    const openingSentence = dateRange
      ? `Congratulations to the following students at Linn-Benton Community College who earned a grade point average of 3.5 or higher for 12 or more graded credits during ${xmlEsc(termLow)}, ${xmlEsc(dateRange)}. These do not include pass/no pass or incomplete credits.`
      : `Congratulations to the following students at Linn-Benton Community College who earned a grade point average of 3.5 or higher for 12 or more graded credits during ${xmlEsc(termLow)}. These do not include pass/no pass or incomplete credits.`;

    bodyXml +=
      `<w:p><w:pPr>${pSpacing()}</w:pPr>` +
        `<w:r>${rPr()}<w:t xml:space="preserve">ALBANY, Ore. &#x2013; ${openingSentence}</w:t></w:r>` +
      `</w:p>`;

    // Blank line
    bodyXml += `<w:p><w:pPr>${pSpacing()}</w:pPr><w:r>${rPr()}</w:r></w:p>`;

    // Student list grouped by city/state
    let currentLoc = null;
    for (const r of rows) {
      const loc = `${r.city}, ${r.state}`;
      if (loc !== currentLoc) {
        if (currentLoc !== null) {
          bodyXml += `<w:p><w:pPr>${pSpacing()}</w:pPr><w:r>${rPr()}</w:r></w:p>`;
        }
        bodyXml +=
          `<w:p><w:pPr>${pSpacing()}</w:pPr>` +
            `<w:r>${rPr(`<w:b/><w:bCs/>`)}<w:t>${xmlEsc(loc)}</w:t></w:r>` +
          `</w:p>`;
        currentLoc = loc;
      }
      bodyXml +=
        `<w:p><w:pPr>` +
          `<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>` +
          `${pSpacing()}<w:ind w:left="720" w:hanging="360"/>` +
        `</w:pPr>` +
          `<w:r>${rPr()}<w:t>${xmlEsc(r.first + " " + r.last)}</w:t></w:r>` +
        `</w:p>`;
    }

    bodyXml += `<w:sectPr/>`;

    const hasLogo = !!logoBase64;

    const documentXml =
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<w:document xmlns:w="${WML}" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
        `<w:body>${bodyXml}</w:body>` +
      `</w:document>`;

    const stylesXml =
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<w:styles xmlns:w="${WML}">` +
        `<w:style w:type="paragraph" w:default="1" w:styleId="Normal">` +
          `<w:name w:val="Normal"/>` +
          `<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr>` +
        `</w:style>` +
      `</w:styles>`;

    const numberingXml =
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<w:numbering xmlns:w="${WML}">` +
        `<w:abstractNum w:abstractNumId="0">` +
          `<w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/>` +
            `<w:lvlText w:val="&#x2022;"/><w:lvlJc w:val="left"/>` +
            `<w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr>` +
            `<w:rPr><w:rFonts w:ascii="Symbol" w:hAnsi="Symbol" w:cs="Symbol"/></w:rPr>` +
          `</w:lvl>` +
        `</w:abstractNum>` +
        `<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>` +
      `</w:numbering>`;

    const contentTypesXml =
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
        `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
        `<Default Extension="xml" ContentType="application/xml"/>` +
        (hasLogo ? `<Default Extension="png" ContentType="image/png"/>` : "") +
        `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>` +
        `<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>` +
        `<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>` +
      `</Types>`;

    const relsXml =
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
        `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>` +
      `</Relationships>`;

    const wordRelsXml =
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
        `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>` +
        `<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>` +
        (hasLogo ? `<Relationship Id="rId6" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.png"/>` : "") +
      `</Relationships>`;

    const zip = new JSZip();
    zip.file("[Content_Types].xml", contentTypesXml);
    zip.file("_rels/.rels", relsXml);
    zip.file("word/document.xml", documentXml);
    zip.file("word/styles.xml", stylesXml);
    zip.file("word/numbering.xml", numberingXml);
    zip.file("word/_rels/document.xml.rels", wordRelsXml);
    if (hasLogo) {
      zip.file("word/media/logo.png", logoBase64, { base64: true });
    }

    const blob = await zip.generateAsync({
      type: "blob",
      mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    });

    const url = URL.createObjectURL(blob);
    const a   = document.createElement("a");
    a.href     = url;
    a.download = termLabel().replace(/\s+/g, "_") + "_Honor_Roll.docx";
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── PDF generation ────────────────────────────────────────────────────────
  async function generatePdf(rows) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });

    const marginL = 72, marginR = 72, marginT = 72;
    const pageW   = doc.internal.pageSize.getWidth();
    const pageH   = doc.internal.pageSize.getHeight();
    const maxW    = pageW - marginL - marginR;
    let y = marginT;

    function checkPageBreak(needed) {
      if (y + needed > pageH - 56) { doc.addPage(); y = marginT; }
    }

    // Contact block
    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    doc.text("FOR IMMEDIATE RELEASE", marginL, y);
    y += 15;
    doc.text("Media Contact: Matt Scotton", marginL, y);
    y += 15;
    doc.text("541-514-1054", marginL, y);
    y += 28;

    // Headline
    const termFull = termLabel();
    const headline = `Linn-Benton Community College Congratulates ${termFull} Honor Roll Students`;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    const headLines = doc.splitTextToSize(headline, maxW);
    headLines.forEach(line => {
      checkPageBreak(22);
      doc.text(line, pageW / 2, y, { align: "center" });
      y += 22;
    });
    y += 10;

    // Opening paragraph
    const dateRange = termDateRange();
    const termLow   = termLower();
    const opening = dateRange
      ? `ALBANY, Ore. \u2013 Congratulations to the following students at Linn-Benton Community College who earned a grade point average of 3.5 or higher for 12 or more graded credits during ${termLow}, ${dateRange}. These do not include pass/no pass or incomplete credits.`
      : `ALBANY, Ore. \u2013 Congratulations to the following students at Linn-Benton Community College who earned a grade point average of 3.5 or higher for 12 or more graded credits during ${termLow}. These do not include pass/no pass or incomplete credits.`;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    const openLines = doc.splitTextToSize(opening, maxW);
    openLines.forEach(line => {
      checkPageBreak(16);
      doc.text(line, marginL, y);
      y += 16;
    });
    y += 14;

    // Student list
    let currentLoc = null;
    for (const r of rows) {
      const loc = `${r.city}, ${r.state}`;
      if (loc !== currentLoc) {
        checkPageBreak(28);
        if (currentLoc !== null) y += 14;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.text(loc, marginL, y);
        y += 18;
        currentLoc = loc;
      }
      checkPageBreak(16);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(11);
      const name = `\u2022  ${r.first} ${r.last}`;
      const lines = doc.splitTextToSize(name, maxW - 12);
      doc.text(lines, marginL + 10, y);
      y += lines.length * 15;
    }

    doc.save(termLabel().replace(/\s+/g, "_") + "_Honor_Roll.pdf");
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function showAlert(type, msg) {
    alertBox.className = `alert ${type} show`;
    alertBox.textContent = msg;
  }

  function resetUI() {
    conflictsWrap.classList.remove("show");
    conflictCards.innerHTML = "";
    previewWrap.classList.remove("show");
    downloadRow.classList.remove("show");
    previewBody.innerHTML = "";
    processedRows = [];
    pendingRows   = [];
  }

  function esc(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
})();
</script>
